version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthandyman_app
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env:ro
      - ./rag/rag_store:/app/rag/rag_store
